<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wilson Wang's project signals and language orbit</title>
  <desc id="desc">A stable local dashboard showing four current projects, nine highlighted builds, and the languages appearing across Wilson's recent work.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="accent" x1="66" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#grid)"/>
  <path d="M600 39V291" stroke="#334155"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="54" y="55" fill="#67E8F9" font-size="14" letter-spacing="2.6">GITHUB / PROJECT SIGNALS</text>
    <text x="54" y="94" fill="#F8FAFC" font-size="26" font-weight="700">Ideas in motion</text>

    <g transform="translate(54 126)">
      <rect width="242" height="74" rx="12" fill="#111C30" stroke="#26364F"/>
      <text x="18" y="29" fill="#94A3B8" font-size="13">CURRENT SIGNALS</text>
      <text x="18" y="58" fill="#F8FAFC" font-size="25" font-weight="700">04</text>
      <circle cx="214" cy="37" r="7" fill="#22D3EE"/>
      <circle cx="214" cy="37" r="14" stroke="#22D3EE" stroke-opacity="0.25"/>
    </g>
    <g transform="translate(314 126)">
      <rect width="232" height="74" rx="12" fill="#111C30" stroke="#26364F"/>
      <text x="18" y="29" fill="#94A3B8" font-size="13">FEATURED BUILDS</text>
      <text x="18" y="58" fill="#F8FAFC" font-size="25" font-weight="700">09</text>
      <path d="M188 47L200 35L209 42L220 25" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="54" y="236" fill="#CBD5E1" font-size="14">SYSTEMS</text>
    <text x="175" y="236" fill="#475569" font-size="14">×</text>
    <text x="199" y="236" fill="#CBD5E1" font-size="14">INTELLIGENCE</text>
    <text x="355" y="236" fill="#475569" font-size="14">×</text>
    <text x="379" y="236" fill="#CBD5E1" font-size="14">EXPRESSION</text>
    <text x="54" y="275" fill="#64748B" font-size="13">snapshot · 2026.08</text>

    <text x="652" y="55" fill="#C4B5FD" font-size="14" letter-spacing="2.6">LANGUAGE ORBIT</text>
    <text x="652" y="94" fill="#F8FAFC" font-size="26" font-weight="700">Recent project footprint</text>

    <g font-size="14">
      <text x="652" y="137" fill="#CBD5E1">C++</text>
      <rect x="760" y="125" width="360" height="14" rx="7" fill="#1E293B"/>
      <rect x="760" y="125" width="344" height="14" rx="7" fill="url(#accent)"/>

      <text x="652" y="173" fill="#CBD5E1">Python</text>
      <rect x="760" y="161" width="360" height="14" rx="7" fill="#1E293B"/>
      <rect x="760" y="161" width="282" height="14" rx="7" fill="url(#accent)"/>

      <text x="652" y="209" fill="#CBD5E1">TypeScript</text>
      <rect x="760" y="197" width="360" height="14" rx="7" fill="#1E293B"/>
      <rect x="760" y="197" width="245" height="14" rx="7" fill="url(#accent)"/>

      <text x="652" y="245" fill="#CBD5E1">Go</text>
      <rect x="760" y="233" width="360" height="14" rx="7" fill="#1E293B"/>
      <rect x="760" y="233" width="174" height="14" rx="7" fill="url(#accent)"/>

      <text x="652" y="281" fill="#CBD5E1">CUDA</text>
      <rect x="760" y="269" width="360" height="14" rx="7" fill="#1E293B"/>
      <rect x="760" y="269" width="150" height="14" rx="7" fill="url(#accent)"/>
