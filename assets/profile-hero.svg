<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wilson Wang / 王文轩</title>
  <desc id="desc">A colorful editorial profile poster for Wilson Wang, an undergraduate in the ACM Honor Class at Shanghai Jiao Tong University.</desc>
  <defs>
    <pattern id="paper-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#18332C" stroke-opacity="0.055"/>
