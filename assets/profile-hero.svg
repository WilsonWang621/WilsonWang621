    <circle cx="1138" cy="28" r="75" fill="#F5F0E8"/>
    <rect x="665" y="306" width="520" height="64" fill="#27A88A"/>
    <circle cx="682" cy="80" r="42" fill="#EF6548"/>
    <path d="M648 122L716 54" stroke="#17332C" stroke-width="5"/>

